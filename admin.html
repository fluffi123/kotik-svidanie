<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fde3ec">
<title>Пульт котиков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@500;700;800&family=Pacifico&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin { width: min(560px, 100%); margin-inline: auto; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 18px; }
  .admin h1 { font-family: var(--f-display); font-weight: 400; font-size: 32px; margin: 0; text-align: center; }
  .admin h2 { font-family: var(--f-hand); font-size: 30px; margin: 0; }
  .admin input {
    width: 100%; font: 600 17px var(--f-body); color: var(--ink); background: #fff;
    border: 2px solid var(--lilac-d); border-radius: 14px; padding: 12px 14px;
  }
  .admin label { font-weight: 800; font-size: 14px; }
  .warn { background: var(--butter); border-radius: 14px; padding: 12px 14px; line-height: 1.45; margin: 0; }
  .toggles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border-radius: 16px; padding: 12px 14px; }
  .toggle b { display: block; }
  .toggle small { opacity: .7; }
  .switch { flex: none; width: 58px; height: 34px; border-radius: 999px; border: 3px solid var(--ink); background: var(--lilac); position: relative; cursor: pointer; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--pink-d); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }
  .switch:disabled { opacity: .5; cursor: default; }
  .feed { display: flex; flex-direction: column; gap: 12px; }
  .entry { background: #fff; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .entry header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry time { font-size: 13px; opacity: .65; font-variant-numeric: tabular-nums; }
  .entry .txt { font-family: var(--f-hand); font-size: 23px; line-height: 1.2; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .entry ol { margin: 0; padding-left: 20px; line-height: 1.5; }
  .entry .del { align-self: flex-end; font-size: 13px; }
  .empty { text-align: center; opacity: .7; margin: 0; }
  .who { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
</style>
</head>
<body>
<main class="admin">
  <h1>Пульт котиков</h1>

  <p class="warn" id="noConfig" hidden>Firebase ещё не подключён: впиши настройки в <b>config.js</b> (инструкция в README.md). До этого ответы сюда не приходят, а все этапы у неё открыты сразу.</p>

  <form class="panel" id="login" hidden>
    <h2>Вход</h2>
    <label for="email">Почта</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p class="note" id="loginError" aria-live="polite"></p>
    <div class="row"><button class="btn yes" type="submit">Войти</button></div>
  </form>

  <div id="panel" hidden>
    <div class="who"><span id="who"></span><button class="link" id="logout" type="button">выйти</button></div>
    <section class="panel">
      <h2>Этапы</h2>
      <p class="note" style="text-align:left">Включи этап, и он сразу откроется у неё на телефоне.</p>
      <ul class="toggles" id="toggles"></ul>
    </section>
    <section class="panel" style="margin-top:18px">
      <h2>Её ответы</h2>
      <div class="feed" id="feed"><p class="empty">Пока пусто. Котики ждут.</p></div>
    </section>
  </div>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
