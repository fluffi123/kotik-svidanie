<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde3ec">
<title>Котик-почтальон</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f6a6c1' d='M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@500;700;800&family=Pacifico&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<template id="catSvg">
<svg viewBox="0 0 200 170">
            <g class="tail">
              <path d="M30 128 C 10 128, 4 108, 14 98" stroke="var(--line)" stroke-width="15" fill="none" stroke-linecap="round"/>
              <path d="M30 128 C 10 128, 4 108, 14 98" stroke="var(--fill)" stroke-width="9" fill="none" stroke-linecap="round"/>
            </g>
            <rect class="leg legB" x="40" y="136" width="22" height="24" rx="11" fill="var(--fill)" stroke="var(--line)" stroke-width="3.5"/>
            <rect class="leg legA" x="138" y="136" width="22" height="24" rx="11" fill="var(--fill)" stroke="var(--line)" stroke-width="3.5"/>
            <g class="squish">
              <path d="M50 46 Q 46 18 60 14 Q 72 18 84 34 Z" fill="var(--fill)" stroke="var(--line)" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M57 38 Q 56 24 62 22 Q 68 26 74 34 Z" fill="var(--ear)"/>
              <path d="M128 32 Q 142 14 154 16 Q 164 22 160 50 Z" fill="var(--fill)" stroke="var(--line)" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M136 32 Q 146 22 152 24 Q 156 30 154 40 Z" fill="var(--ear)"/>
              <path d="M34 152 C 14 150, 12 112, 22 88 C 34 52, 72 30, 106 30 C 146 30, 184 56, 188 102 C 191 138, 176 152, 152 152 Z"
                    fill="var(--fill)" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/>
              <ellipse class="eye" cx="117" cy="90" rx="5" ry="6.5" fill="var(--line)"/>
              <ellipse class="eye" cx="160" cy="88" rx="5" ry="6.5" fill="var(--line)"/>
              <circle cx="118.6" cy="87.6" r="1.8" fill="#fff"/>
              <circle cx="161.6" cy="85.6" r="1.8" fill="#fff"/>
              <ellipse cx="106" cy="106" rx="10" ry="5.5" fill="var(--blush)" opacity=".8"/>
              <ellipse cx="172" cy="103" rx="10" ry="5.5" fill="var(--blush)" opacity=".8"/>
              <path d="M131 99 q4.5 5 9 0 q4.5 5 9 0" stroke="var(--line)" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <g class="plaster" transform="rotate(-18 100 38)">
                <rect x="82" y="31" width="36" height="13" rx="6" fill="#ffe0c2" stroke="var(--line)" stroke-width="2.5"/>
                <path d="M96 34 v7 M104 34 v7" stroke="var(--line)" stroke-width="1.6" opacity=".6"/>
              </g>
            </g>
            <rect class="leg legA" x="58" y="138" width="22" height="22" rx="11" fill="var(--fill)" stroke="var(--line)" stroke-width="3.5"/>
            <rect class="leg legB" x="120" y="138" width="22" height="22" rx="11" fill="var(--fill)" stroke="var(--line)" stroke-width="3.5"/>
          </svg>
</template>


<div class="hub" id="hub">
  <header class="hub-head">
    <h1>Наша прогулка</h1>
    <p>Чтобы открыть этап, ответь на вопрос о нас. А котиков можно нажимать.</p>
  </header>
  <ul class="stage-list" id="stageList"></ul>
  <div class="hub-cats" id="hubCats"></div>
  <p class="scene-caption" id="sceneCaption" aria-live="polite">Нажми на котиков</p>
</div>

<div class="play" id="play" hidden>
  <button class="link back" id="back" type="button">← к этапам</button>
  <div id="playBody"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
